<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VoidLure — Admin Panel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#e8e6e3;line-height:1.6}
:root{--border:rgba(255,255,255,0.08);--card-bg:rgba(255,255,255,0.03);--muted:#888}
.gradient-text{background:linear-gradient(135deg,#ffffff,#666666);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.container{max-width:1200px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--border);background:rgba(10,10,10,0.85);backdrop-filter:blur(12px);padding:16px 0}
.header-inner{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:900;text-decoration:none;color:#fff}
.logo-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);font-size:18px;color:#fff}
.btn-primary{padding:10px 24px;border-radius:12px;background:#fff;color:#000;font-weight:700;font-size:14px;border:none;cursor:pointer;transition:transform .15s}
.btn-primary:hover{transform:scale(.98)}
.btn-danger{padding:8px 16px;border-radius:8px;background:#ff4444;color:#fff;font-weight:600;font-size:13px;border:none;cursor:pointer;transition:transform .15s}
.btn-danger:hover{transform:scale(.95)}
.btn-success{padding:8px 16px;border-radius:8px;background:#00c853;color:#fff;font-weight:600;font-size:13px;border:none;cursor:pointer;transition:transform .15s}
.btn-success:hover{transform:scale(.95)}
.section{padding:40px 0}
.admin-card{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:24px}
.admin-card h2{font-size:20px;font-weight:700;margin-bottom:16px;color:#fff}

th,td{padding:12px;text-align:left;border-bottom:1px solid var(--border)}

td{font-size:14px}
.tier-badge{display:inline-block;padding:2px 12px;border-radius:4px;font-size:11px;font-weight:600;text-transform:uppercase}
.tier-free{background:rgba(255,255,255,0.05);color:var(--muted);border:1px solid rgba(255,255,255,0.05)}
.tier-vip{background:rgba(255,215,0,0.15);color:#ffd700;border:1px solid rgba(255,215,0,0.2)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-box{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center}
.stat-box .number{font-size:32px;font-weight:900;background:linear-gradient(135deg,#fff,#888);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-box .label{font-size:12px;color:var(--muted);margin-top:4px}
.toast{position:fixed;bottom:30px;right:30px;padding:14px 24px;border-radius:12px;background:#1a1a1a;border:1px solid var(--border);color:#e8e6e3;font-size:14px;box-shadow:0 8px 32px rgba(0,0,0,0.5);transform:translateY(120px);opacity:0;transition:all .4s ease;z-index:999;max-width:400px}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-color:rgba(255,255,255,0.3);background:rgba(255,255,255,0.05)}
.toast.error{border-color:#ff6b6b;background:rgba(255,107,107,0.05)}
.login-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);backdrop-filter:blur(12px);display:flex;justify-content:center;align-items:center;z-index:1000}
.login-box{background:#1a1a1a;border:1px solid var(--border);border-radius:24px;padding:40px;max-width:400px;width:90%}
.login-box h2{font-size:24px;font-weight:700;margin-bottom:8px}
.login-box p{color:var(--muted);font-size:14px;margin-bottom:24px}
.login-box input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card-bg);color:#e8e6e3;font-size:14px;outline:none;margin-bottom:16px;transition:border-color .2s}
.login-box input:focus{border-color:#fff}
.login-box .btn-primary{width:100%;justify-content:center}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.1);border-top:2px solid #fff;border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
</style>
</head>

</div>

</div>
</div>
<div class="admin-card">
<h2>Quick Actions</h2>
<div style="display:flex;gap:12px;flex-wrap:wrap;">
<button class="btn-success" onclick="refreshData()">Refresh Data</button>
</div>
</div>
</div>
</section>
</div>
